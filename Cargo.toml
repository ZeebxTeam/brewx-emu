[workspace]
members = [
    ".",
    "frontends/headless",
    "frontends/qt-standalone",
]
resolver = "3"

[package]
name = "brewx"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
authors = ["ZeebxTeam"]
repository = "https://github.com/ZeebxTeam/brewx-emu"
description = "Qualcomm BREW 1.x to 3.x emulator"
publish = false

# The emulator core, without an interface: consumed by the headless and Qt frontends.
[lib]
name = "brewx"
path = "src/lib.rs"

[dependencies]
# The host-independent BREW platform: .mod/.mif/.bar, vtables, memory map, heap, VFS and save
# state. Lives in its own repository (ZeebxTeam/zeebx-core). Without the `sql` feature: SQLMGR
# belongs to the Zeebo's 4.x line, and `bundled` would build SQLite in C for nothing on 1.x–3.x.
# To develop alongside the core, uncomment the `[patch.crates-io]` below.
zeebx-core = { version = "0.1", default-features = false }
# Recompiles A32/Thumb to native host code, as in zeebx-emu. Only emits x86-64 and AArch64: the
# targets without it (wasm, iOS, 32-bit ARM) will need an interpreter backend.
dynarmic = "0.1.3"
# Decoding PNG resources and writing frame dumps. MIT/Apache-2.0.
png = "0.18"
# 8x8 glyphs for text until handset fonts are emulated. MIT, data only.
font8x8 = "0.3"

# [patch.crates-io]
# zeebx-core = { path = "../zeebx-core" }

# Same lesson as zeebx-emu: at opt-level 0 the dispatch loop and the rasterizer run ~7x slower,
# and the incremental rebuild does not get worse at 2.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
