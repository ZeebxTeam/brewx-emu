[package]
name = "brewx-standalone-qt"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Qualcomm BREW 1.x to 3.x emulator, with a Qt Quick interface"
authors = ["ZeebxTeam"]
repository = "https://github.com/ZeebxTeam/brewx-emu"
publish = false

# `brewx-qt`, not `brewx`: the short name stays free for a future command line, as in zeebx-emu
# (`zeebx` is the CLI, `zeebx-qt` the interface).
[[bin]]
name = "brewx-qt"
path = "src/main.rs"

[dependencies]
brewx = { path = "../.." }
# The Qt 6 bridge, same version as zeebx-emu.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.10"
