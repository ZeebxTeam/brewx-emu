[package]
name = "brewx-standalone-qt"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Emulador de Qualcomm BREW 1.x a 3.x, com interface Qt Quick"
authors = ["ZeebxTeam"]
repository = "https://github.com/ZeebxTeam/brewx-emu"
publish = false

# `brewx-qt`, e não `brewx`: o nome curto fica livre para uma linha de comando futura, como no
# zeebx-emu (`zeebx` é a CLI, `zeebx-qt` a interface).
[[bin]]
name = "brewx-qt"
path = "src/main.rs"

[dependencies]
brewx = { path = "../.." }
# A ponte com o Qt 6, a mesma versão do zeebx-emu.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }

[build-dependencies]
cxx-qt-build = "0.10"
